<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="header">
    <div class="container">
      <div class="header-wrapper">
        <div class="logo"></div>
        <nav class="nav">
          <a class="nav-link" href="#">Главная</a>
          <a class="nav-link" href="#">Меню</a>
          <a class="nav-link" href="#">О нас</a>
          <a class="nav-link" href="#">Контакты</a>
        </nav>
        <a class="cart" href="#">
          $125
          <span class="cart-count">5</span>
        </a>
      </div>
    </div>
  </header>
  <section class="hero">
    <div class="container">
      <ul class="breadcrumbs">
        <li class="breadcrumbs-item">
          <a class="breadcrumbs-link" href="#">Главная</a>
        </li>
        <li class="breadcrumbs-item">Меню</li>
      </ul>
      <h1 class="hero-title">Наше Меню</h1>
      <p class="hero-description">
        Выбирай из предложенного ассортимента и мы доставим блюдо в&nbsp;течении часа
      </p>
    </div>
  </section>
  <section class="banner">
    <div class="container">
      <div class="banner-wrapper">
        <h2 class="banner-title">
          <span>Скидка</span>
          -30%
        </h2>
        <p class="banner-description">
          Только при покупке 3-х и более позиций,
          мы дарим скидку. Акции не&nbsp;суммируются.
        </p>
        <button class="banner-btn">
          Купить сейчас
        </button>
      </div>
    </div>
  </section>
  <main>
    <section>
      <div class="container">
        <div class="menu">
          <div class="menu-header">
            <h2 class="menu-title">Бургеры</h2>
            <select name="" id="">
              <option value="Сортировать" disabled selected>Сортировать</option>
              <option value="По умолчанию">По умолчанию</option>
              <option value="">По убыванию цены</option>
              <option value="">По возрастанию цены</option>
            </select>
          </div>
        </div>
      </div>
    </section>
    <section>
      <div class="container">
        <div class="menu">

        </div>
      </div>
    </section>
  </main>
</body>

</html>
